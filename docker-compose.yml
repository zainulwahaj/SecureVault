services:
  postgres:
    image: postgres:16-alpine
    container_name: vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vaultdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vaultdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vault-net

  redis:
    image: redis:7-alpine
    container_name: vault-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vault-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultdb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      STORAGE_DIR: /app/storage
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-24}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAX_FILE_VERSIONS: ${MAX_FILE_VERSIONS:-10}
      DEBUG: ${DEBUG:-false}
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vault-net

  nginx:
    image: nginx:alpine
    container_name: vault-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/out:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vault-net

volumes:
  postgres_data:
  redis_data:
  file_storage:

networks:
  vault-net:
    driver: bridge
