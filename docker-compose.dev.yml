services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/app:/app/app:ro
      - file_storage:/app/storage
    environment:
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:3000"]'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    ports:
      - "8080:80"
